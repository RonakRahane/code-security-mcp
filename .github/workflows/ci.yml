name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms are tested because the scanner does path handling and
        # spawns git, and those are exactly where Windows and POSIX diverge.
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      # Actions are pinned to full commit SHAs. A tag is mutable: whoever
      # controls the action repository can repoint v4 at different code, which
      # would then run with this workflow's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Before the tests, not after: dist/ is gitignored, and the CLI tests
      # spawn the built entry point to assert on its exit codes. Those only
      # exist at the process boundary, so there is no way to cover them from
      # inside the suite.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  detection-regression:
    name: Detection regression
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs. A tag is mutable: whoever
      # controls the action repository can repoint v4 at different code, which
      # would then run with this workflow's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Semgrep is the engine most users run, so the gate has to exercise it.
      # Without this step the harness measured only the fallback pattern engine
      # and reported green while the Semgrep path went untested.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install --disable-pip-version-check semgrep

      - name: Verify Semgrep is on PATH
        run: semgrep --version

      # Guards against rule changes that silently lose detections. The harness
      # runs offline, so its verdict never depends on network conditions, and
      # --require-semgrep turns a missing Semgrep into a failure rather than a
      # quietly narrower run.
      - name: Run detection regression harness
        run: npm run benchmark -- --require-semgrep
        env:
          SENTINEL_OFFLINE: '1'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs. A tag is mutable: whoever
      # controls the action repository can repoint v4 at different code, which
      # would then run with this workflow's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
